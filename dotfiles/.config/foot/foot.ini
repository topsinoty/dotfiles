[main]
font=JetBrainsMono Nerd Font Mono:size=13

[bell]
system=yes
visual=yes

[desktop-notifications]
command=notify-send --wait --app-name ${app-id} --icon ${app-id} --category ${category} --urgency ${urgency} --expire-time ${expire-time} --hint STRING:image-path:${icon} --hint BOOLEAN:suppress-sound:${muted} --hint STRING:sound-name:${sound-name} --replace-id ${replace-id} ${action-argument} --print-id -- ${title} ${body}

[cursor]
style=underline
blink=yes

[colors-dark]
alpha=0.94
background=030609
foreground=d7e0e7
regular0=030609
regular1=ff466b
regular2=00f5a0
regular3=00c8ff
regular4=00c8ff
regular5=647582
regular6=00c8ff
regular7=d7e0e7
bright0=647582
bright1=ff466b
bright2=00f5a0
bright3=d7e0e7
bright4=00c8ff
bright5=d7e0e7
bright6=00f5a0
bright7=d7e0e7
selection-foreground=030609
selection-background=00c8ff
urls=00c8ff
cursor=030609 00f5a0

[csd]
preferred=none
