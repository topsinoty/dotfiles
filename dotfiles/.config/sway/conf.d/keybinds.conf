unbindsym Print
bindsym Print exec ~/.local/bin/dotfiles-screenshot full
bindsym $mod+Shift+s exec ~/.local/bin/dotfiles-screenshot region

unbindsym $mod+d
unbindsym $mod+space
bindsym $mod+space exec $menu

unbindsym $mod+b
bindsym $mod+b exec ~/.local/bin/dotfiles-open-browser

unbindsym $mod+v
bindsym $mod+v exec ~/.local/bin/dotfiles-clipboard
