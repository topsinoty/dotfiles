# Replace Fedora's bare grim command with persistent, clipboard-ready captures.
unbindsym Print

bindsym Print exec sh -c 'mkdir -p "$HOME/Pictures/Screenshots"; file="$HOME/Pictures/Screenshots/screenshot-full-$(date +%Y%m%d-%H%M%S).png"; grim "$file"; wl-copy --type image/png < "$file"; notify-send "Screenshot saved" "$file"'

bindsym $mod+Shift+s exec sh -c 'geometry=$(slurp) || exit 0; [ -n "$geometry" ] || exit 0; mkdir -p "$HOME/Pictures/Screenshots"; file="$HOME/Pictures/Screenshots/screenshot-region-$(date +%Y%m%d-%H%M%S).png"; grim -g "$geometry" "$file"; wl-copy --type image/png < "$file"; notify-send "Screenshot saved" "$file"'

# Keep the launcher on the legacy shortcut instead of Fedora's defaults.
unbindsym $mod+d
unbindsym $mod+space

bindsym $mod+space exec $menu

# Launch the desktop's registered default browser instead of hardcoding one.
unbindsym $mod+b

bindsym $mod+b exec sh -c 'browser=$(xdg-settings get default-web-browser); [ -n "$browser" ] && gtk-launch "$browser"'

# Choose clipboard history through the existing launcher UI.
unbindsym $mod+v

bindsym $mod+v exec sh -c 'entry=$(cliphist list | fuzzel --dmenu --prompt="CLIP> ") || exit 0; [ -n "$entry" ] || exit 0; printf "%s\n" "$entry" | cliphist decode | wl-copy'
